name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.10.11
          uv sync --locked --extra dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify tag matches package version
        run: |
          test "$GITHUB_REF_TYPE" = "tag" || { echo "Run releases from a version tag."; exit 1; }
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          pyproject = Path("pyproject.toml")
          data = tomllib.loads(pyproject.read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject.toml version ($PROJECT_VERSION)."
            exit 1
          fi

      - name: Verify quality gates
        run: |
          ruff check .
          mypy src desktop
          pytest -q

      - name: Build distributions
        run: uv build --out-dir dist/release

      - name: Verify distributions
        run: uvx --from twine==7.0.0 twine check dist/release/*

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/runtime-requirements.txt > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/runtime-requirements.txt --no-deps --disable-pip
          uvx --from bandit==1.9.4 bandit -r src desktop -q

      - name: Build and smoke-test desktop bundle
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          python scripts/build_mcpb.py
          python scripts/smoke_mcpb.py dist/desktop/*.mcpb

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/release/
          skip-existing: true

      - name: Verify published PyPI distributions and live updater
        run: |
          python scripts/verify_pypi.py
          python scripts/smoke_mcpb.py dist/desktop/*.mcpb "${GITHUB_REF_NAME#v}"

      - name: Create or update GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/release/* dist/desktop/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/release/* dist/desktop/* \
              --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
